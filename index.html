<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Inspector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="icon-btn sidebar-toggle" id="btn-menu" aria-label="Toggle sidebar">☰</button>
      <div class="header-title">
        <h1>DB Inspector</h1>
        <span>Static Database Workspace</span>
      </div>
      <div class="header-actions">
        <button data-action="save-workspace">Save</button>
        <button data-action="import" class="btn-primary">Import</button>
        <button data-action="export-workspace">Export</button>
        <button data-action="settings">Settings</button>
      </div>
    </header>

    <div class="app-body">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="workspace-name" id="workspace-name">Local Workspace</div>
          <button data-action="add-table" class="btn-primary">+ Add Table</button>
        </div>
        <nav class="table-list" id="table-list" aria-label="Tables"></nav>
        <div class="sidebar-footer">
          <button data-action="query-helper" class="btn-secondary">Query Helper</button>
        </div>
      </aside>

      <main id="main" class="main">
        <div id="main-content"></div>
      </main>
    </div>

    <footer class="statusbar">
      <span id="status-tables">Tables: 0</span>
      <span id="status-rows">Rows: 0</span>
      <span id="status-workspace">Workspace: Local</span>
    </footer>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal"></div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
