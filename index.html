<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عباس عاقبتی | درباره من</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/portfolio.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- بخش پروژه‌ها (Projects Section) -->
  <section id="portfolio" class="portfolio-section">
    <div class="container">
      <h2 class="section-title">پروژه‌ها</h2>

      <!-- جدول پروژه‌ها -->
      <div class="projects-table-container">
        <table class="projects-table">
          <thead>
            <tr>
              <th>عنوان پروژه</th>
              <th>توضیحات</th>
              <th>تکنولوژی‌ها</th>
              <th>لینک‌ها</th>
            </tr>
          </thead>
          <tbody id="projects-list">
            <!-- پروژه‌ها توسط JS یا به صورت استاتیک رندر می‌شوند -->
            <tr>
              <td className="project-title-cell">پروژه نمونه</td>
              <td>توضیحات مربوط به پروژه در این قسمت قرار می‌گیرد.</td>
              <td>
                <span class="tech-badge">HTML</span>
                <span class="tech-badge">CSS</span>
                <span class="tech-badge">JavaScript</span>
              </td>
              <td class="project-links-cell">
                <a href="#" target="_blank" rel="noopener noreferrer" class="btn-link">دمو</a>
                <a href="#" target="_blank" rel="noopener noreferrer" class="btn-link github">گیت‌هاب</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </section>

</body>
</html>
